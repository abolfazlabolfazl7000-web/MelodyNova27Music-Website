<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MelodyNova27 Music</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#09090d;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:35px 20px;
 text-align:center;
 background:linear-gradient(135deg,#21152d,#09090d)
}
header h1{font-size:32px;margin:0 0 10px}
header p{color:#aaa}

.container{
 max-width:1000px;
 margin:auto;
 padding:25px 15px 110px
}

.search{
 width:100%;
 padding:16px;
 border-radius:14px;
 border:1px solid #292933;
 background:#15151b;
 color:white;
 font-size:16px;
 outline:none;
 margin-bottom:25px
}

.card{
 display:flex;
 align-items:center;
 gap:15px;
 background:#15151b;
 border:1px solid #292933;
 border-radius:18px;
 padding:14px;
 margin-bottom:15px
}

.cover{
 width:80px;
 height:80px;
 border-radius:14px;
 object-fit:cover;
 background:#222
}

.info{flex:1}
.info h2{margin:0 0 7px;font-size:18px}
.info p{margin:0;color:#999}

button{
 border:0;
 border-radius:12px;
 padding:12px 17px;
 cursor:pointer;
 font-weight:bold
}

footer{
 text-align:center;
 color:#666;
 padding:30px
}

.player{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#111116;
 border-top:1px solid #292933;
 padding:12px;
 text-align:center
}

audio{width:min(600px,100%)}

@media(max-width:600px){
 .card{padding:10px}
 .cover{width:65px;height:65px}
 button{padding:10px}
}
</style>
</head>

<body>

<header>
<h1>🎵 MelodyNova27 Music</h1>
<p>دنیای موسیقی در یک جا</p>
</header>

<div class="container">

<input
 id="search"
 class="search"
 placeholder="🔎 جستجوی آهنگ یا خواننده..."
>

<div id="musicList">

<div class="card" data-search="آهنگ نمونه خواننده نمونه">

<img
 class="cover"
 src="https://via.placeholder.com/300"
>

<div class="info">
<h2>آهنگ نمونه</h2>
<p>خواننده نمونه</p>
</div>

<button onclick="playSong('music/song.mp3')">
▶ پخش
</button>

</div>

</div>
</div>

<footer>
© 2026 MelodyNova27 Music
</footer>

<div class="player">
<audio id="player" controls></audio>
</div>

<script>

const player=document.getElementById("player");

function playSong(song){
 player.src=song;
 player.play();
}

document.getElementById("search").addEventListener("input",function(){

 const value=this.value.toLowerCase();

 document.querySelectorAll(".card").forEach(card=>{

  const text=card.dataset.search.toLowerCase();

  card.style.display=text.includes(value)?"flex":"none";

 });

});

</script>

</body>
</html>
